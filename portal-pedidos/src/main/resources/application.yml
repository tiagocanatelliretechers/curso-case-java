# =====================================================================
# Portal de Pedidos B2B - configuracao ENDURECIDA (branch solucao-hardened)
# Aplica as correcoes das Aulas 2-6. Perfil default = H2 (dev).
# =====================================================================
spring:
  application:
    name: portal-pedidos
  profiles:
    active: h2

  datasource:
    url: jdbc:h2:mem:portal;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: true
    show-sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  # Lab 6.1 - H2 console desabilitado
  h2:
    console:
      enabled: false

  thymeleaf:
    cache: false

  servlet:
    multipart:
      # Lab 2.4 - limite de upload
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  servlet:
    session:
      cookie:
        # Lab 4.3 - flags de seguranca do cookie de sessao
        http-only: true
        secure: false        # DEV ONLY (sem HTTPS local). Em producao: true
        same-site: lax
      timeout: 15m
  error:
    # Lab 5.1 - nao vazar detalhe ao cliente
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

# Lab 6.1 - Actuator minimo; endpoints sensiveis protegidos no SecurityConfig
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
    env:
      show-values: never

# ---------------------------------------------------------------------
# Segredos: em producao vem de variavel de ambiente / secrets manager.
# Os defaults abaixo sao DEV ONLY e NAO devem ser usados em producao.
# ---------------------------------------------------------------------
portal:
  jwt:
    # Lab 4.2 - chave Base64 (>=32 bytes). Override: PORTAL_JWT_SECRET
    secret: ${PORTAL_JWT_SECRET:AyjpJmIAw5EyzdygA5Ydd2vm8pp5Sqed7wDAk6MFKbY=}
    expiration-ms: 900000    # 15 min
  crypto:
    # Lab 4.1 - chave Base64 de 32 bytes (AES-256). Override: PORTAL_CRYPTO_KEY
    key: ${PORTAL_CRYPTO_KEY:cMlQRds5K9r42D8FYoxCQhM/vdyxStTh1Ew+OsG9Gjs=}
  upload:
    dir: ./uploads

logging:
  level:
    com.thrive.portal: INFO
